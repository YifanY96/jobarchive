<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="archive-token" content="__ARCHIVE_TOKEN__"><title>职投档案</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><a class="brand" href="/" data-i18n="职投档案">职投档案</a><p class="tagline" data-i18n="每一次投递，都有据可查。">每一次投递，都有据可查。</p><nav aria-label="Navigation"><button data-view="applications" class="active">▤ <span data-i18n="投递档案">投递档案</span></button><button data-view="mail">✉ <span data-i18n="求职邮箱">求职邮箱</span></button><button data-view="settings">◈ <span data-i18n="备份与设置">备份与设置</span></button></nav><div class="local"><i></i> <span data-i18n="数据保存在本机">数据保存在本机</span><br><small data-i18n="无需账号 · 无云端存储">无需账号 · 无云端存储</small><small id="app-version"></small></div></aside>
<main><header><div><small id="eyebrow">你的求职工作台</small><h1 id="page-title">投递档案</h1></div><button id="add" class="primary" data-i18n="＋ 新建投递">＋ 新建投递</button></header><div id="stats" class="stats"></div>
<section id="applications-view"><div class="toolbar application-filters"><input id="search" data-placeholder="搜索公司名或职位名" data-aria="搜索档案" placeholder="搜索公司名或职位名" aria-label="搜索档案"><select id="status-filter" data-aria="筛选状态" aria-label="筛选状态"><option value="" data-i18n="全部状态">全部状态</option></select><input id="date-from" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" data-date data-aria="开始日期" aria-label="开始日期"><span data-i18n="至">至</span><input id="date-to" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" data-date data-aria="结束日期" aria-label="结束日期"><select id="sort" data-aria="排序" aria-label="排序"><option value="updated_at" data-i18n="最近更新">最近更新</option><option value="applied_date" data-i18n="投递日期">投递日期</option><option value="company" data-i18n="公司名称">公司名称</option></select></div><div class="filter-summary"><span id="result-count" role="status"></span><button id="clear-filters" class="text-button" hidden data-i18n="清除筛选">清除筛选</button><small data-i18n="Ctrl + K 搜索 · Ctrl + N 新建">Ctrl + K 搜索 · Ctrl + N 新建</small></div><div class="workspace"><div id="list" class="records"></div><article id="detail" class="detail" aria-live="polite"></article></div></section>
<section id="mail-view" hidden><div class="panel"><h2 data-i18n="Gmail 求职邮箱">Gmail 求职邮箱</h2><p id="gmail-state" data-i18n="正在读取连接状态…">正在读取连接状态…</p><div class="actions"><label class="button"><span data-i18n="导入 Google 配置 JSON">导入 Google 配置 JSON</span><input type="file" id="google-config" accept=".json" hidden></label><button id="gmail-connect" data-i18n="连接 Gmail">连接 Gmail</button><button id="gmail-status" data-i18n="刷新连接状态">刷新连接状态</button><button id="gmail-disconnect" class="subtle" data-i18n="断开并清除本机邮件缓存">断开并清除本机邮件缓存</button></div><details><summary data-i18n="首次连接方法">首次连接方法</summary><p data-i18n="gmailSetup"></p><p data-i18n="gmailPrivacy"></p><a href="https://developers.google.com/identity/protocols/oauth2/native-app" target="_blank" rel="noreferrer" data-i18n="Google 官方配置说明 ↗">Google 官方配置说明 ↗</a></details></div><div class="toolbar"><input id="gmail-query" value="newer_than:90d" data-placeholder="Gmail 搜索条件，例如 from:招聘邮箱" data-aria="Gmail 搜索条件"><button id="gmail-sync" class="primary" data-i18n="同步邮件">同步邮件</button><button id="gmail-more" disabled data-i18n="下一批">下一批</button><input id="mail-search" data-placeholder="搜索本机邮件" data-aria="搜索邮件"></div><p class="hint" data-i18n="每批最多同步 30 封。邮件可关联到投递档案；状态更新由你确认。"></p><div class="workspace"><div id="mail-list" class="records"></div><article id="mail-detail" class="detail"></article></div></section>
<section id="settings-view" hidden><div class="panel language-panel"><div><h2 data-i18n="界面语言">界面语言</h2><p data-i18n="切换后立即生效，下次打开仍会保留。">切换后立即生效，下次打开仍会保留。</p><p class="hint" data-i18n="只改变界面显示，JD、备注、邮件和材料保持原文。"></p></div><label class="language-choice"><span data-i18n="选择语言">选择语言</span><select id="language" data-aria="界面语言" aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></div><div class="panel"><h2 data-i18n="完整备份">完整备份</h2><p data-i18n="backupDescription"></p><div class="actions"><button id="backup" class="primary" data-i18n="下载完整备份 ZIP">下载完整备份 ZIP</button><button id="csv" data-i18n="导出记录 CSV">导出记录 CSV</button><label class="button"><span data-i18n="从 ZIP 恢复">从 ZIP 恢复</span><input id="restore" type="file" accept=".zip" hidden></label></div><p class="hint" data-i18n="恢复会替换当前档案；软件会先自动保存一份恢复前备份。CSV 只包含投递字段，不含附件。"></p></div><div class="panel"><h2 data-i18n="本机保存位置">本机保存位置</h2><p id="data-path" class="mono"></p><p id="close-hint"></p><button id="shutdown">停止本地服务</button></div></section>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="application-form"><div class="dialog-head"><div><small data-i18n="记录这一次机会">记录这一次机会</small><h2 id="editor-title">新建投递</h2></div><button type="button" id="close-editor" data-aria="关闭" aria-label="关闭">×</button></div><div class="form-grid"><label><span data-i18n="公司名称 *">公司名称 *</span><input name="company" required maxlength="200"></label><label><span data-i18n="职位名称 *">职位名称 *</span><input name="title" required maxlength="300"></label><label class="wide"><span data-i18n="投递网页">投递网页</span><div class="input-action"><input name="url" type="url" placeholder="https://…"><button type="button" id="fetch-jd" data-i18n="抓取 JD">抓取 JD</button></div></label><label><span data-i18n="投递日期">投递日期</span><input name="applied_date" data-aria="投递日期" aria-label="投递日期" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" data-date></label><label><span data-i18n="当前状态">当前状态</span><select name="status"></select></label><label class="wide"><span data-i18n="职位描述（可修改）">职位描述（可修改）</span><textarea name="jd" rows="8" data-placeholder="填入网页可自动提取公开 JD；登录或动态网页可手动粘贴。"></textarea></label><label class="wide"><span data-i18n="备注">备注</span><textarea name="notes" rows="2" data-placeholder="联系人、下一步行动、面试安排…"></textarea></label></div><div class="upload-block"><h3 data-i18n="本次实际提交的文件">本次实际提交的文件</h3><p class="hint" data-i18n="每次新增都独立归档。更新状态或再次上传不会覆盖历史文件。单份上限 25 MB。"></p><div class="form-grid"><label><span data-i18n="CV 文件">CV 文件</span><input id="cv-files" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md,.rtf"></label><label><span data-i18n="动机信文件">动机信文件</span><input id="letter-files" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md,.rtf"></label><label><span data-i18n="这批材料的提交日期">这批材料的提交日期</span><input name="submitted_date" data-aria="这批材料的提交日期" aria-label="这批材料的提交日期" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" data-date></label><label><span data-i18n="材料版本说明">材料版本说明</span><input name="document_label" data-placeholder="例如：针对数据分析岗修改版"></label><label class="wide"><span data-i18n="或直接粘贴这次提交的动机信">或直接粘贴这次提交的动机信</span><textarea name="new_letter" rows="4" data-placeholder="保存后作为独立 TXT 文件归档"></textarea></label></div></div><div class="dialog-footer"><span id="form-message" class="hint" role="status"></span><button type="submit" class="primary" id="save" data-i18n="保存档案">保存档案</button></div></form></dialog><dialog id="confirmation" aria-labelledby="confirm-message"><p id="confirm-message"></p><div class="actions"><button id="confirm-cancel">取消</button><button id="confirm-ok" class="primary">继续</button></div></dialog><dialog id="date-picker" aria-labelledby="date-picker-title"><div class="date-heading"><button id="date-prev" type="button">‹</button><h2 id="date-picker-title"></h2><button id="date-next" type="button">›</button></div><div id="date-weekdays" class="date-grid date-weekdays" aria-hidden="true"></div><div id="date-days" class="date-grid"></div><div class="date-actions"><button id="date-today" type="button"></button><button id="date-clear" type="button"></button><button id="date-close" type="button"></button></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
